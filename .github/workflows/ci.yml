name: CI

# Runs on every PR: build the artifact, run the build tests, verify the dist tree, and
# syntax-check the inlined JS. A second job screenshots each pack at a phone and desktop
# viewport, uploads them as a downloadable artifact, and posts a sticky PR comment linking
# to it. Nothing here deploys; deploy stays on push-to-main in deploy.yml.
#
# Why a download link and not inline images: this repo is private, so an inlined image URL
# would have to be publicly fetchable by GitHub's image proxy - which artifacts (auth-gated
# zips) are not, and which comment attachments have no API to create. Inline previews would
# need an external public host (e.g. Cloudflare R2); not worth the infra for a nicety.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # sticky visual-preview comment

# One CI run per PR; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: '1.61.1'   # bump alongside the browser cache key below

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SVG rasterizer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Build tests
        run: python3 -m unittest discover -s tests -t .

      - name: Build dist/index.html
        run: make build

      - name: Verify dist tree
        run: bash scripts/verify-dist.sh

      - name: Syntax-check inline JS
        run: node scripts/check-js.mjs

  screenshots:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SVG rasterizer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Build dist/index.html
        run: make build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright + Chromium
        run: |
          npm install -g "playwright@${PLAYWRIGHT_VERSION}"
          playwright install --with-deps chromium

      - name: Screenshot every pack
        run: node scripts/shot.mjs --all-packs --out shots

      - name: Upload screenshots (artifact fallback)
        uses: actions/upload-artifact@v4
        with:
          name: torreld-screenshots
          path: shots/
          if-no-files-found: error

      - name: Sticky comment linking to the screenshots
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- torreld-preview -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const sha = (context.payload.pull_request?.head?.sha || '').slice(0, 7);
            const body = [
              marker,
              '### Screenshots',
              '',
              `Phone (390x844) and desktop (1280x800) shots of all packs for \`${sha}\` are attached to this run.`,
              '',
              `**[Download the \`torreld-screenshots\` artifact](${runUrl})** - see the Artifacts section at the bottom of the run.`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
