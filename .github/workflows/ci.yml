name: CI

# Runs on every PR: build the artifact, run the build tests, verify the dist tree, and
# syntax-check the inlined JS. A second job screenshots each pack at a phone and desktop
# viewport, always uploads them as a downloadable artifact, and - once the R2 variables
# below are set - posts them inline as a sticky PR comment. Nothing here deploys; deploy
# stays on push-to-main in deploy.yml.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # sticky visual-preview comment

# One CI run per PR; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: '1.61.1'   # bump alongside the browser cache key below

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SVG rasterizer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Build tests
        run: python3 -m unittest discover -s tests -t .

      - name: Build dist/index.html
        run: make build

      - name: Verify dist tree
        run: bash scripts/verify-dist.sh

      - name: Syntax-check inline JS
        run: node scripts/check-js.mjs

  screenshots:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SVG rasterizer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Build dist/index.html
        run: make build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright + Chromium
        run: |
          npm install -g "playwright@${PLAYWRIGHT_VERSION}"
          playwright install --with-deps chromium

      - name: Screenshot every pack
        run: node scripts/shot.mjs --all-packs --out shots

      - name: Upload screenshots (artifact fallback)
        uses: actions/upload-artifact@v4
        with:
          name: torreld-screenshots
          path: shots/
          if-no-files-found: error

      # --- Inline PR comment (only when R2 is configured; see docs/BUILD.md) ---

      - name: Compute preview metadata
        if: ${{ github.event_name == 'pull_request' && vars.R2_PUBLIC_BASE_URL != '' }}
        id: meta
        run: |
          sha='${{ github.event.pull_request.head.sha }}'
          echo "sha=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "prefix=pr/${{ github.event.number }}/${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Upload screenshots to R2
        if: ${{ github.event_name == 'pull_request' && vars.R2_PUBLIC_BASE_URL != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for f in shots/*.png; do
            npx --yes "wrangler@4" r2 object put \
              "${{ vars.R2_BUCKET }}/${{ steps.meta.outputs.prefix }}/$(basename "$f")" \
              --file="$f" --remote --content-type=image/png
          done

      - name: Post sticky visual-preview comment
        if: ${{ github.event_name == 'pull_request' && vars.R2_PUBLIC_BASE_URL != '' }}
        uses: actions/github-script@v7
        env:
          PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE_URL }}/${{ steps.meta.outputs.prefix }}
          SHA: ${{ steps.meta.outputs.sha }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- torreld-preview -->';
            const base = process.env.PUBLIC_BASE;
            const files = fs.readdirSync('shots').filter(f => f.endsWith('.png')).sort();
            const packs = {};
            for (const f of files) {
              const m = f.match(/^(.*)-(mobile|desktop)\.png$/);
              if (m) (packs[m[1]] ??= {})[m[2]] = `${base}/${f}`;
            }
            let body = `${marker}\n## Visual preview\n\ncommit \`${process.env.SHA}\`\n\n`;
            for (const [pack, v] of Object.entries(packs)) {
              body += `<details${Object.keys(packs).length === 1 ? ' open' : ''}><summary><b>${pack}</b></summary>\n\n`;
              body += `| mobile | desktop |\n|---|---|\n`;
              body += `| ![${pack} mobile](${v.mobile || ''}) | ![${pack} desktop](${v.desktop || ''}) |\n\n`;
              body += `</details>\n\n`;
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
