name: CI

# Runs on every PR: build the artifact, run the build tests, verify the dist tree, and
# syntax-check the inlined JS. A second job screenshots each pack at a phone and desktop
# viewport, uploads them as a downloadable artifact, and posts a sticky PR comment showing
# them inline. Nothing here deploys; deploy stays on push-to-main in deploy.yml.
#
# Inline images live on the orphan `ci-previews` branch and are embedded via
# raw.githubusercontent.com, which renders in comments only because the repo is PUBLIC.
# scripts/previews.sh pushes each PR's shots there under pr-<n>/. Previews are kept after
# the PR closes so merged PRs keep their inline screenshots; prune manually with
# `scripts/previews.sh remove <n>` if the branch ever needs trimming. The artifact upload
# stays as a no-JS-needed fallback.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One CI run per PR; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: '1.61.1'   # bump alongside the browser cache key below

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SVG rasterizer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Build tests
        run: python3 -m unittest discover -s tests -t .

      - name: Build dist/index.html
        run: make build

      - name: Verify dist tree
        run: bash scripts/verify-dist.sh

      - name: Syntax-check inline JS
        run: node scripts/check-js.mjs

  screenshots:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write        # push preview PNGs to the ci-previews branch
      pull-requests: write   # sticky visual-preview comment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SVG rasterizer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Build dist/index.html
        run: make build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright + Chromium
        run: |
          npm install -g "playwright@${PLAYWRIGHT_VERSION}"
          playwright install --with-deps chromium

      - name: Screenshot every pack
        run: node scripts/shot.mjs --all-packs --out shots

      - name: Upload screenshots (artifact fallback)
        uses: actions/upload-artifact@v4
        with:
          name: torreld-screenshots
          path: shots/
          if-no-files-found: error

      - name: Publish previews to the ci-previews branch
        if: ${{ github.event_name == 'pull_request' }}
        run: bash scripts/previews.sh publish "${{ github.event.number }}" shots

      - name: Sticky inline-screenshot comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- torreld-preview -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const sha = (context.payload.pull_request?.head?.sha || '').slice(0, 7);
            // Cache-bust with the short sha: the pr-<n>/ path is stable but its contents change per push.
            const raw = (f) => `https://raw.githubusercontent.com/${owner}/${repo}/ci-previews/pr-${issue_number}/${f}?${sha}`;
            const files = fs.readdirSync('shots').filter((f) => f.endsWith('.png')).sort();
            const packs = {};
            for (const f of files) {
              const m = f.match(/^(.*)-(mobile|desktop)\.png$/);
              if (m) (packs[m[1]] ??= {})[m[2]] = raw(f);
            }
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            let body = `${marker}\n## Visual preview\n\ncommit \`${sha}\` - [download all as an artifact](${runUrl})\n\n`;
            for (const [pack, v] of Object.entries(packs)) {
              body += `<details><summary><b>${pack}</b></summary>\n\n`;
              body += `| mobile | desktop |\n|---|---|\n`;
              body += `| ![${pack} mobile](${v.mobile || ''}) | ![${pack} desktop](${v.desktop || ''}) |\n\n`;
              body += `</details>\n\n`;
            }
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
