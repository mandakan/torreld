name: Deploy to Cloudflare

# Pushes to main rebuild dist/index.html and deploy to torreld.urdr.dev via the
# assets-only Worker defined in wrangler.jsonc. Manual re-deploys are available
# via the workflow_dispatch trigger in the Actions tab.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only one deploy at a time; if a newer push arrives mid-flight, cancel the
# in-progress run and deploy the newer one instead.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://torreld.urdr.dev/
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SVG rasterizer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Run build tests
        run: python3 -m unittest discover -s tests -t .

      - name: Build dist/index.html
        run: make build

      - name: Verify build outputs
        run: |
          if grep -n 'INJECT:' dist/index.html; then
            echo "::error::dist/index.html contains unresolved <!-- INJECT:* --> tokens"
            exit 1
          fi
          test -f dist/favicon.png || { echo "::error::missing dist/favicon.png"; exit 1; }
          test -f dist/og/default.png || { echo "::error::missing dist/og/default.png"; exit 1; }
          for pid in grip-first reloads stage-planning; do
            test -f "dist/og/$pid.png" || { echo "::error::missing dist/og/$pid.png"; exit 1; }
            test -f "dist/p/$pid/index.html" || { echo "::error::missing stub for $pid"; exit 1; }
            grep -q "https://torreld.urdr.dev/og/$pid.png" "dist/p/$pid/index.html" \
              || { echo "::error::stub $pid missing absolute og:image"; exit 1; }
          done

      - name: Syntax-check inline JS
        run: |
          python3 - <<'PY'
          import re, sys
          src = open('dist/index.html', encoding='utf-8').read()
          m = re.search(r'<script>(.*?)</script>', src, re.S)
          assert m, 'no <script> found in dist/index.html'
          open('/tmp/check.js', 'w').write(m.group(1))
          PY
          node --check /tmp/check.js

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          # Pin wrangler 4.x. The action defaults to 3.90.0, which doesn't
          # support assets-only Workers (no `main` script) and fails with
          # "Missing entry-point" against our wrangler.jsonc.
          wranglerVersion: '4'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
